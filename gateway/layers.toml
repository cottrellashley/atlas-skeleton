# The gateway's layers (§6.5.2), which tools/layercheck enforces (§6.5.9,
# ATLAS-PACKAGES-001): a package imports only packages in its own layer or a
# lower one; the members of an independent group never import each other;
# only a deployable imports an adapter. Paths are relative to the repository
# module path; a path ending in /... covers everything under it. Only
# production code is checked: a test may assemble anything.

# Each adapter, and each service, is a member of its group, with everything
# under it; members never import each other (ATLAS-PACKAGES-009).
independent = ["gateway/adapter/*", "gateway/svc/*"]

# An adapter is reached through a port, and chosen only by a deployable.
adapters = "gateway/adapter/..."
adapter_importers = ["gateway/cmd/..."]

[layers]
# The protocol and the kit, shared with every Go client; snowarrow is the
# handoff format clients decode (§2.2.1).
0 = ["sdk/go/protocol/...", "sdk/go/kit/...", "sdk/go/snowarrow/..."]
1 = ["gateway/ports", "gateway/porttest", "gateway/fakes"]
2 = ["gateway/core/..."]
3 = ["gateway/adapter/..."]
4 = ["gateway/svc/..."]
5 = ["gateway/edge/..."]
6 = ["gateway/cmd/..."]

[[forbid]]
from = "gateway/svc/..."
imports = ["sdk/go/kit/jwt", "sdk/go/kit/limit", "sdk/go/kit/idem"]
why = "no service verifies tokens, counts limits or keeps idempotency keys itself (ATLAS-MECH-004)"

[[forbid]]
from = "gateway/..."
imports = ["sdk/go/client/...", "sdk/go/engine/..."]
why = "the gateway is the writer side; the client is the reader side (§5)"
