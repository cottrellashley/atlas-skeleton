[project]
name = "fi-lib-atlas"
version = "0.1.0"
description = "Atlas from Python: a face over atlas-engine, the Go client it ships (spec §5.1)."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
arrow = ["pyarrow>=16"]
pandas = ["pyarrow>=16", "pandas>=2.2"]
test = ["pyarrow>=16", "pandas>=2.2", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fiatlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
